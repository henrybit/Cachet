[package]
name = "app"
version = "0.1.0"
description = "Cachet — Redis / Memcached cache management desktop app"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
redis = "0.27"
memcache = "0.17"
urlencoding = "2"
keyring = "3"
